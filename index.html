<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEEL &amp; ASHES</title>
<meta name="description" content="STEEL & ASHES · لعبة استراتيجية · a strategy game">
<style>
  :root { --bg: #15171a; --panel: #1d2024; --text: #e6e2da; --muted: #a39d92; --line: #34383e; --accent: #d9822b; --link: #f0a65a; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f1ea; --panel: #ffffff; --text: #23211d; --muted: #6b655b; --line: #ddd6c9; --accent: #b5651d; --link: #9a4f0c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font: 17px/1.8 "Segoe UI", Tahoma, "Noto Naskh Arabic", "Noto Sans", Arial, sans-serif;
  }
  .card { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 12px; padding: 28px 24px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: .12em; direction: ltr; }
  h1 span { color: var(--accent); }
  p { margin: 4px 0; color: var(--muted); }
  nav { margin-top: 20px; display: grid; gap: 10px; }
  a { display: block; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--link); text-decoration: none; }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>STEEL <span>&amp;</span> ASHES</h1>
    <p>لعبة استراتيجية لهواتف أندرويد والكمبيوتر</p>
    <p lang="en" dir="ltr">A strategy game for Android phones and PCs</p>
    <nav>
      <a href="privacy.html?lang=ar">سياسة الخصوصية</a>
      <a href="privacy.html?lang=en" lang="en" dir="ltr">Privacy Policy</a>
    </nav>
  </div>
</body>
</html>
